<!DOCTYPE html>
<html lang="en">
<head><title>Challenges</title></head>
<body>
    <div style="text-align: center; margin-top: 40px;">
        <h1>🌍 Active Challenges</h1>
        <div style="display: flex; gap: 20px; justify-content: center; margin-top: 20px;">
            {% for challenge in challenges %}
            <div style="border: 1px solid #ccc; border-radius: 10px; padding: 20px; width: 300px;">
                <h3>{{ challenge['title'] }}</h3>
                <p>{{ challenge['description'] }}</p>
                <div style="color: #ff9800; font-weight: bold;">⭐ {{ challenge['points'] }} Points</div>
                <br>
                {% if challenge['id'] in joined_ids %}
                    <button style="padding: 10px; background: gray; color: white; border: none; border-radius: 5px;" disabled>✅ Joined</button>
                {% else %}
                    <form action="/join_challenge/{{ challenge['id'] }}" method="POST">
                        <button type="submit" style="padding: 10px; background: #008CBA; color: white; border: none; border-radius: 5px;">Join Challenge</button>
                    </form>
                {% endif %}
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
