<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Eco Challenges</title>
    <style>
        .card-container { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
        .card { border: 1px solid #ccc; border-radius: 10px; padding: 20px; width: 300px; text-align: center; box-shadow: 2px 2px 10px rgba(0,0,0,0.1); }
        .category { background-color: #4CAF50; color: white; padding: 5px 10px; border-radius: 5px; font-size: 14px; }
        .points { font-size: 18px; font-weight: bold; color: #ff9800; margin: 15px 0; }
        .join-btn { background-color: #008CBA; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; }
        .join-btn:hover { background-color: #005f73; }
    </style>
</head>
<body>
    <div style="text-align: center; margin-top: 40px;">
        <h1>🌍 Active Campus Challenges</h1>
        <p>Join a challenge to earn extra Eco Points!</p>
        
        <div class="card-container">
            <!-- This loop creates a card for every challenge in the database -->
            {% for challenge in challenges %}
            <div class="card">
                <span class="category">{{ challenge['category'] }}</span>
                <h3>{{ challenge['title'] }}</h3>
                <p>{{ challenge['description'] }}</p>
                <div class="points">⭐ {{ challenge['points'] }} Points</div>
                
                <!-- We will make this button work in the next step -->
                <form action="#" method="POST">
                    <button type="submit" class="join-btn">Join Challenge</button>
                </form>
            </div>
            {% else %}
            <p>No active challenges at the moment.</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
