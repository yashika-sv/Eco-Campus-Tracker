<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - Eco Campus Tracker</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="profile-container">

        <h1>👤 My Profile</h1>

<p class="profile-subtitle">Your student account information</p>

<div class="profile-info">

            <div class="profile-info">

                <div class="profile-item">
                    <span>🆔 Student ID</span>
                    <strong>{{ student["id"] }}</strong>
                </div>

                <div class="profile-item">
                    <span>👤 Full Name</span>
                    <strong>{{ student["name"] }}</strong>
                </div>

                <div class="profile-item">
                    <span>📧 Email</span>
                    <strong>{{ student["email"] }}</strong>
                </div>

                <div class="profile-item">
                    <span>🌱 Eco Points</span>
                    <strong>{{ student["eco_points"] }}</strong>
                </div>

            </div>

            <div class="profile-actions">

                <a href="{{ url_for('edit_profile') }}" class="profile-btn">
                    ✏️ Edit Profile
                </a>

                <a href="{{ url_for('dashboard') }}" class="profile-btn secondary">
                    ↩️ Back to Dashboard
                </a>

            </div>

        </div>

    </div>

</body>

</html>
